<!DOCTYPE html>
<html>
<head>
  <title>Sales Summary October</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container">
    <h1>Sales Summary October</h1>
    <div id="total-sales"></div>
  </div>

  <script>
    fetch('data.csv', { headers: { 'Content-Type': 'text/csv' } })
      .then(response => response.text())
      .then(data => {
        let rows = data.split('\n');
        let total = 0;
        for (let i = 1; i < rows.length; i++) {
          let columns = rows[i].split(',');
          total += Number(columns[1]); // Assuming sales data is in the second column
        }
        document.querySelector('#total-sales').innerHTML = `Total Sales: $${total.toFixed(2)}`;
      });
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
